[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scapy-ai-analyzer"
version = "0.1.0"
description = "Evidence-based network packet analysis with Scapy and optional AI interpretation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Scapy AI Analyzer Contributors" }]
keywords = ["scapy", "pcap", "network-analysis", "dfir", "ai"]

dependencies = [
    "scapy>=2.5.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
openai = [
    "httpx>=0.27",
]

[project.scripts]
scapy-ai = "scapy_ai_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
